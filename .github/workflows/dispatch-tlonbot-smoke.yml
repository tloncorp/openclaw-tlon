name: Dispatch tlonbot smoke

# When a commit lands on master (post-PR merge), trigger tlonbot's e2e
# smoke workflow with this commit's SHA as the plugin ref. tlonbot pins
# its bot container's plugin clone to that exact SHA, so the smoke is
# pinned to "did this specific plugin commit play nicely with tlonbot's
# prompts/persona".
#
# We trust ci.yml's PR-gating to have already passed for this commit;
# this workflow does not re-run any tests, just dispatches.

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tlonbot smoke
        env:
          GH_TOKEN: ${{ secrets.TLONBOT_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::TLONBOT_DISPATCH_TOKEN secret is not set; skipping dispatch"
            exit 0
          fi
          echo "Dispatching tlonbot smoke for plugin ref $GITHUB_SHA"
          gh api repos/tloncorp/tlonbot/dispatches \
            --method POST \
            --field event_type=tlonbot-smoke-test \
            --field 'client_payload[ref]='"$GITHUB_SHA"
